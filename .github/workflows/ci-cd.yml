name: CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Install and start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          # wait until ready
          for i in {1..30}; do
            curl -s http://localhost:11434/api/tags && break
            sleep 2
          done
          ollama pull llama3.2   # or whatever model your app uses
          ollama pull nomic-embed-text  # if you use embeddings

      - name: Build vector index
        run: python scripts/build_index.py

      - name: Run unit tests
        run: pytest tests/ -v --tb=short
        # Note: Full RAG tests that call Ollama are skipped in CI
        # because Ollama is not available in the GitHub runner by default.